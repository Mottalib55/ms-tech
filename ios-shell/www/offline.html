<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MS Tech</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --ink:#0b0b0c; --muted:#5f5f66; --btn:#0b0b0c; --on:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --ink:#f4f4f5; --muted:#a1a1a8; --btn:#fff; --on:#0b0b0c; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px -apple-system, system-ui, sans-serif; }
  main { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:32px; text-align:center; }
  b { width:44px; height:44px; border-radius:10px; background:var(--btn); color:var(--on); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
  h1 { margin:8px 0 0; font-size:20px; font-weight:600; }
  p { margin:0; max-width:300px; font-size:15px; line-height:1.5; color:var(--muted); }
  button { margin-top:10px; height:44px; padding:0 20px; border:0; border-radius:10px; background:var(--btn); color:var(--on); font:inherit; font-weight:500; }
</style>
</head>
<body>
<main>
  <b>MS</b>
  <h1 id="t">No connection</h1>
  <p id="b">MS Tech needs the internet to show your accounts. Check your connection, then try again.</p>
  <button id="r" type="button">Try again</button>
</main>
<script>
  var T = {
    fr: ["Pas de connexion", "MS Tech a besoin d'Internet pour afficher vos comptes. Vérifiez votre connexion, puis réessayez.", "Réessayer"],
    ar: ["لا يوجد اتصال", "يحتاج MS Tech إلى الإنترنت لعرض حساباتك. تحقّق من اتصالك ثم أعد المحاولة.", "إعادة المحاولة"]
  };
  var l = (navigator.language || "en").slice(0, 2), s = T[l];
  if (s) {
    document.documentElement.lang = l;
    if (l === "ar") document.documentElement.dir = "rtl";
    document.getElementById("t").textContent = s[0];
    document.getElementById("b").textContent = s[1];
    document.getElementById("r").textContent = s[2];
  }
  document.getElementById("r").onclick = function () { location.href = "https://ms-tech-orpin.vercel.app/"; };
</script>
</body>
</html>
